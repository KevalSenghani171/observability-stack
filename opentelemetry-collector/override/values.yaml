image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.153.0"
  pullPolicy: IfNotPresent

mode: deployment


config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 512

    resource:
      attributes:
        - action: upsert
          key: deployment.environment
          value: kubernetes

  exporters:
    debug:
      verbosity: basic

    otlp/tempo:
      endpoint: tempo.devops-tools.svc.cluster.local:4317
      tls:
        insecure: true

    otlphttp/loki:
      endpoint: http://loki.devops-tools.svc.cluster.local:3100/otlp

    prometheus:
      endpoint: 0.0.0.0:8889

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [debug, otlp/tempo]

      logs:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [debug, otlphttp/loki]

      metrics:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [prometheus]


