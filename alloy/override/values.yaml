alloy:                       # the Alloy sub-chart
  controller:
    type: daemonset
  alloy:
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    configMap:
      create: false          # don't generate one, use ours
      name: alloy-config     # created by templates/configmap.yaml
      key: config.alloy