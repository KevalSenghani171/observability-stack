AWX:
  # enable use of awx-deploy template
  enabled: true
  name: awx

  spec:
    admin_user: admin
    service_type: LoadBalancer

    ingress_type: ingress

    hostname: awx.company.com

    postgres_storage_class: gp3

    postgres_storage_requirements:
      requests:
        storage: 20Gi

    projects_storage_class: gp3

    projects_storage_size: 50Gi

  # configurations for external postgres instance
  postgres:
    enabled: false
    host: Unset
    port: 5678
    dbName: Unset
    username: admin
    # for secret management, pass in the password independently of this file
    # at the command line, use --set AWX.postgres.password
    password: Unset
    sslmode: prefer
    type: unmanaged

rbac:
  create: true

operator-controller: {}

operator-controller-containers: {}
