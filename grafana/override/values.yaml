deploymentStrategy:
  type: Recreate


envValueFrom:
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-aws-secret
      key: username
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-aws-secret
      key: password
  GF_DATABASE_HOST:
    secretKeyRef:
      name: grafana-aws-secret
      key: host
  GF_DATABASE_NAME:
    secretKeyRef:
      name: grafana-aws-secret
      key: database


vault:
  enabled: false

  # annotations:
