
serviceAccount:
  create: false
  name: vault-serviceaccount

vault:
  enabled: true

  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-status: "update"
    # vault.hashicorp.com/agent-inject-secret-clisecret: "secret/clisecret"
    # vault.hashicorp.com/agent-inject-template-clisecret: |
    #   {{- with secret "secret/clisecret" -}}
    #   pattoken={{ .Data.data.token }}
    #   {{- end }}
    vault.hashicorp.com/agent-inject-secret-mysql-secret: "secret/mysql-secret"
    vault.hashicorp.com/agent-inject-template-mysql-secret: |
      {{- with secret "secret/mysql-secret" -}}
      export GF_DATABASE_HOST={{ .Data.data.host }}
      export GF_DATABASE_USERNAME={{ .Data.data.username }}
      export GF_DATABASE_PASSWORD={{ .Data.data.password }}
      {{- end }}
    vault.hashicorp.com/role: "vault-role"

image:
  registry: docker.io
  repository: grafana/grafana
  tag: "13.0.1-security-01"

persistence:
  type: pvc
  enabled: true
  storageClassName: ebs-sc
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  finalizers:
    - kubernetes.io/pvc-protection

service:
  enabled: true
  type: NodePort
  port: 3000
  targetPort: 3000

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "1"
    memory: 1Gi

# extraSecretMounts:
#   - name: grafana-mysql
#     secretName: grafana-mysql
#     mountPath: /etc/secrets/grafana-mysql
#     readOnly: true

podSecurityContext:
  fsGroup: 472

extraInitContainers:
  - name: init-folders
    image: busybox
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/grafana/dashboards/OBS
    volumeMounts:
      - name: grafana-provisioning
        mountPath: /var/lib/grafana/dashboards

extraVolumes:
  - name: grafana-provisioning
    persistentVolumeClaim:
      claimName: grafana-provisioning

extraVolumeMounts:
  - name: grafana-provisioning
    mountPath: /etc/grafana/provisioning

envFromSecrets:
  - name: grafana-mysql

datasources:
 datasources.yaml:
   apiVersion: 1
   datasources:
    - name: prometheus-main
      type: prometheus
      url: http://prometheus-server.devops-tools.svc.cluster.local:9090
      uid: asdfasdf20gzkb
      httpMode: 'POST'
      editable: false
      default: true
      orgId: 1
    - name: loki-main
      type: loki
      url: http://loki.devops-tools.svc.cluster.local:3100
      uid: bserfvdf4kpvkf
      httpMode: 'POST'
      editable: false
      orgId: 1
    - name: pyroscope-main
      type: grafana-pyroscope-datasource
      url: http://pyroscope.devops-tools.svc.cluster.local:4040
      uid: gbsradlqxmv4d
      httpMode: 'POST'
      editable: false
      orgId: 1
    - name: jaeger-main
      type: jaeger
      url: http://jaeger.observability.svc.cluster.local:16686
      uid: daasdfaw5nuoc
      httpMode: 'POST'
      editable: false
      orgId: 1

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: OBS
        orgId: 1
        type: file
        disableDeletion: false
        allowUiUpdates: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards/OBS
          foldersFromFilesStructure: true

grafana.ini:
  database:
    type: mysql
    host: {{ vault "secret/mysql-secret" "db_host" }}
    name: grafana
    user: {{ vault "secret/mysql-secret" "db_username" }}
    password: {{ vault "secret/mysql-secret" "db_password" }}
    ssl_mode: disable
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning