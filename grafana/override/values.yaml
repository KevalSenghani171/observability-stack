image:
  registry: docker.io
  repository: grafana/grafana
  tag: "12.0.0"

persistence:
  type: pvc
  enabled: true
  storageClassName: ebs-sc
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  finalizers:
    - kubernetes.io/pvc-protection


service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

  hosts:
    - grafana-keval.duckdns.org

  path: /
  pathType: Prefix

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana-keval.duckdns.org

# service:
#   enabled: true
#   type: NodePort
#   port: 3000
#   targetPort: 3000

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  fsGroup: 472

extraInitContainers:
  - name: init-folders
    image: busybox
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/grafana/dashboards/OBS
    volumeMounts:
      - name: grafana-provisioning
        mountPath: /var/lib/grafana/dashboards

admin:
  existingSecret: grafana-admin-secret2
  userKey: username
  passwordKey: password

extraVolumes:
  - name: grafana-provisioning
    persistentVolumeClaim:
      claimName: grafana-provisioning

extraVolumeMounts:
  - name: grafana-provisioning
    mountPath: /var/lib/grafana/dashboards
    readOnly: false

extraSecretMounts:
  - name: grafana-aws-secret
    mountPath: /mnt/secrets-store
    secretName: grafana-aws-secret
    readOnly: true

