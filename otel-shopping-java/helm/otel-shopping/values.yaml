replicaCount: 1

image:
  repository: kevalsenghani/otel-shopping-java
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

resources: {}
nodeSelector: {}
tolerations: []
affinity: []

otel:
  enabled: false
  collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    service:
      port: 4317
    resources: {}

app:
  otelServiceName: otel-shopping-java
  extraEnv: []
