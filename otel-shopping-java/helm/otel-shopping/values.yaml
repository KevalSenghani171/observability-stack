replicaCount: 1

image:
  repository: otel-shopping
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

resources: {}
nodeSelector: {}
tolerations: []
affinity: []

otel:
  enabled: true
  collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    service:
      port: 4317
    resources: {}

app:
  otelServiceName: otel-shopping
  extraEnv: []
