apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret2
  namespace: devops-tools
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: grafana-admin-secret2
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: grafana-admin-secret2
