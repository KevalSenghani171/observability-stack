deploymentMode: Monolithic   # name used by your chart version (see the validate.yaml error)

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: "3.7.2"

  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks-observability-aws
      ruler: loki-ruler-s3-observability-aws
      admin: loki-admin-observability-aws
    s3:
      region: ap-south-1
      # no keys here; they come from the env vars under singleBinary.extraEnv

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3

  limits_config:
    retention_period: 720h   # 30 days, adjust

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: 1800MiB
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: grafana-loki-bucket-secret
          key: access-key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: grafana-loki-bucket-secret
          key: access-password
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ebs-sc      # must exist on your cluster: kubectl get sc
    accessModes:
      - ReadWriteOnce
    enableStatefulSetAutoDeletePVC: true
    whenScaled: Delete
    whenDeleted: Delete

# Required: chart defaults these to 3 replicas, which conflicts with single-binary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0

minio:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false